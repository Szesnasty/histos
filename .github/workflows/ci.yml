# The gates this library sells to other people, run against this library.
#
# `histos coverage` and `histos drift` are pitched as CI gates, so a repository that
# does not run them in its own CI is asking for trust it has not spent. The
# conformance corpus matters most: it is what a second implementation reads, and a
# corpus that only runs when somebody remembers is a description of what the engine
# used to do rather than a contract.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The distribution claims `Operating System :: OS Independent`, so the suite has to
  # actually run somewhere that is not Linux. Two of the guarantees are platform-shaped:
  # the audit log's cross-process `flock` does not exist on Windows (documented in
  # SECURITY.md), and the owner-only `0o600` mode only means what it says on POSIX.
  # Both are meant to degrade, not crash. Linux carries the full version range; macOS
  # and Windows run the lowest supported version, which is enough to catch a hard
  # platform break without paying for the whole grid.
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # `[dev]` brings ruff, pytest and pyyaml. The library itself keeps zero runtime
      # dependencies, and the wheel job below is what proves that claim.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Style is a property of the source, not of the runner, so it is checked once.
      # Running `ruff format --check` on Windows would also be checking the checkout's
      # line endings, which is a different question and not one this gate is asking.
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check .

      - name: Format check
        if: runner.os == 'Linux'
        run: ruff format --check .

      - name: Tests, including the conformance corpus
        run: pytest -q

  gates:
    name: the CI gates, on the gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[yaml]"

      - name: Every gallery policy is structurally valid
        run: |
          for policy in policies/*.policy.yaml; do
            echo "── $policy"
            histos validate "$policy"
          done

      - name: Review runs on every gallery policy
        run: |
          for policy in policies/*.policy.yaml; do
            histos review "$policy" > /dev/null
          done

      - name: Coverage fails on a tool the policy never declared
        run: |
          # The gate working is the assertion: an undeclared tool must exit non-zero.
          if histos coverage policies/01-minimal.policy.yaml --tools make_refund,delete_everything; then
            echo "coverage did not fail on an undeclared tool" >&2
            exit 1
          fi

      - name: Drift fails when a tool definition moves
        run: |
          set -e
          tmp="$(mktemp -d)"
          cat > "$tmp/tools.json" <<'JSON'
          {"tools": [{"name": "make_refund", "description": "Refund an order.",
            "inputSchema": {"type": "object",
              "properties": {"order_id": {"type": "string"},
                             "amount": {"type": "integer", "minimum": 1, "maximum": 500}},
              "required": ["order_id", "amount"]}}]}
          JSON
          histos import "$tmp/tools.json" --kind mcp --out "$tmp/security.policy.json" --locator ci
          histos drift "$tmp/security.policy.json" --source "$tmp/tools.json" --kind mcp

          # Widen the bound and add an argument: this must now fail, and must say the
          # change reaches enforcement.
          python - "$tmp/tools.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          doc = json.load(open(path))
          props = doc["tools"][0]["inputSchema"]["properties"]
          props["amount"]["maximum"] = 50000
          props["include_sensitive_data"] = {"type": "boolean"}
          json.dump(doc, open(path, "w"))
          PY
          if histos drift "$tmp/security.policy.json" --source "$tmp/tools.json" --kind mcp; then
            echo "drift did not fail on a widened, extended tool" >&2
            exit 1
          fi

      - name: The examples still run
        run: |
          for example in examples/*.py; do
            echo "── $example"
            python "$example" > /dev/null
          done

  wheel:
    name: wheel builds and imports with no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Installed bare, in a clean environment: if anything imported at package level
      # ever grows a third-party dependency, this is where it is caught. "Zero runtime
      # dependencies" is a load-bearing claim, so it gets a test rather than a promise.
      - name: Install the wheel alone and import it
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install dist/*.whl
          /tmp/bare/bin/python -c "import histos; print(histos.__version__)"
          /tmp/bare/bin/histos --help > /dev/null
          test -z "$(/tmp/bare/bin/pip list --format=freeze | grep -viE '^(histos|pip|setuptools|wheel)==')" \
            || { echo "the wheel pulled in a runtime dependency" >&2; \
                 /tmp/bare/bin/pip list --format=freeze >&2; exit 1; }

  metadata:
    name: the built metadata is the page nobody can edit later
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # `readme = "README.md"` makes the README the long description verbatim, and a
      # released version's project page cannot be edited afterwards. 0.1.0 was one
      # upload away from a page that said the package was not on PyPI and offered an
      # unpinned `git+https` install instead, so the phrase is a build failure now.
      - name: PKG-INFO does not deny its own release
        run: |
          tar -xOzf dist/*.tar.gz --wildcards '*/PKG-INFO' > /tmp/pkg-info
          if grep -niE 'not (yet )?on pypi|git\+https://github\.com/Szesnasty/histos|until that tag is published|trusted-publisher workflow completes' /tmp/pkg-info; then
            echo "the long description tells PyPI visitors the package is not on PyPI" >&2
            exit 1
          fi

      # The sdist is what a distribution packager and an offline reader get. It ships
      # the trust model and the normative artifacts or the README's links are dead for
      # them too — MANIFEST.in says so, and this is what checks that it still does.
      - name: The sdist ships what MANIFEST.in promises
        run: |
          files="$(tar -tzf dist/*.tar.gz | cut -d/ -f2-)"
          for promised in SECURITY.md CHANGELOG.md CONTRIBUTING.md \
                          examples/quickstart.py policies/README.md \
                          spec/decision-codes.json conformance/manifest.json; do
            echo "$files" | grep -qx "$promised" || { echo "sdist is missing $promised" >&2; exit 1; }
          done

  typecheck:
    name: types (the py.typed marker has to mean something)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # This library ships `py.typed`, which tells every downstream type-checker to
      # trust these annotations. Shipping that marker without checking them here is
      # asking other people's CI to enforce a claim this repository never tested.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy==1.14.1

      - name: mypy
        run: mypy src/histos

  supplychain:
    name: dependency and static-analysis gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit==2.9.0 bandit==1.8.6

      # The core has zero runtime dependencies, so this audits the dev toolchain —
      # which is still what builds and signs the artifact everyone else installs.
      #
      # Audited from a frozen list rather than from the live environment, because
      # `--strict` treats "could not audit this distribution" as a failure and `histos`
      # itself is installed editable: pip-audit looks it up on PyPI, does not find the
      # working tree there, and the gate fails for the one package it has no business
      # checking. `--exclude-editable` drops exactly that entry and nothing else, so
      # every real dependency is still audited and still strictly.
      - name: pip-audit
        run: |
          python -m pip freeze --exclude-editable > /tmp/frozen.txt
          pip-audit --strict -r /tmp/frozen.txt

      # `-ll` reports medium and high only: a security library that cries wolf about
      # every `assert` in its own tests teaches its maintainers to skip the job.
      - name: bandit
        run: bandit -r src/histos -ll

  demos:
    name: the demos the README quotes numbers from
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Only the model-free parts run here. The rest need a local 7B model, which CI
      # has no business pulling — but a demo that silently rots between releases is
      # how the README came to quote numbers the code no longer produced.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[yaml,dev]" mcp
          # hunt.py drives LangChain's and LangGraph's real executors; demo 02's
          # model-free checks import its graph. Neither pulls in a model.
          python -m pip install -r demo/00-mediation/requirements.txt
          python -m pip install -r demo/02-accounts-payable/requirements.txt

      - name: Mediation — no path may reach the tool without a decision
        run: |
          cd demo/00-mediation
          python hunt.py

      - name: Accounts payable — the model-free assertions behind the baseline
        run: |
          cd demo/02-accounts-payable
          python run.py checks

      # The lock-freshness gate lives in the test suite but needs the demo server, which
      # only this job installs. Run it here so it is not permanently skipped: it exists
      # because a stale lock shipped once, in the demo whose whole subject is that a lock
      # catches the rug-pull.
      - name: The committed lock still matches what the importer produces
        run: pytest tests/test_lockfile.py -q

      # Every attack the six adversarial passes found, run against the shipped library
      # through its public surface. Exits with the number that reached something, so a
      # regression in any of them fails the job rather than printing a line nobody reads.
      - name: The review's own attacks, against the shipped library
        run: python demo/05-the-review/attacks.py

      - name: Every demo policy is valid and reviewable
        run: |
          for policy in demo/*/security.policy.yaml; do
            echo "── $policy"
            histos validate "$policy"
            histos review "$policy" > /dev/null
          done
