# Release Please owns release PRs, version bumps, tags and GitHub Releases. The
# build and PyPI upload stay in this workflow deliberately: events created with
# GITHUB_TOKEN do not start another workflow, so a separate tag-only publisher
# would silently skip releases created by Release Please.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to rebuild and publish after a failed release run (leave empty otherwise)
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: prepare or create a release
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' ||
         (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  gates:
    name: lint and types
    needs: release-please
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || needs.release-please.outputs.tag_name }}
          fetch-tags: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" mypy
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  build:
    name: build, then test what was built
    needs: release-please
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || needs.release-please.outputs.tag_name }}
          fetch-tags: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the build toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: The release identity matches the built version
        env:
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          tagged="${RELEASE_TAG#v}"
          built="$(python -c 'import sys; sys.path.insert(0, "src"); from histos._version import __version__; print(__version__)')"
          actual_tag="$(git describe --tags --exact-match HEAD)"
          test -n "$RELEASE_TAG"
          test "$actual_tag" = "$RELEASE_TAG" || {
            echo "checkout is at $actual_tag, not requested release tag $RELEASE_TAG" >&2; exit 1; }
          test "$tagged" = "$built" || {
            echo "tag $RELEASE_TAG does not match histos._version $built" >&2; exit 1; }
          if test -n "$RELEASE_VERSION"; then
            test "$RELEASE_VERSION" = "$built" || {
              echo "Release Please proposed $RELEASE_VERSION but the build is $built" >&2; exit 1; }
          fi
          test -f "dist/histos-$built.tar.gz"
          test -f "dist/histos-$built-py3-none-any.whl"

      - name: twine check
        run: twine check --strict dist/*

      # The long description is the project page, and the project page for a version
      # cannot be edited after upload. 0.1.0's README told visitors the package was not
      # on PyPI and to install it from an unpinned git ref; that shipped once as a near
      # miss, so it is now a release gate rather than a review item.
      - name: The metadata does not deny its own release
        run: |
          python - <<'PY'
          import pathlib, re, tarfile
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              name = next(n for n in archive.getnames() if n.endswith("/PKG-INFO"))
              handle = archive.extractfile(name)
              assert handle is not None
              metadata = handle.read().decode("utf-8")
          for phrase in (
              "Not on PyPI",
              "not yet on PyPI",
              "git+https://github.com/Szesnasty/histos",
              "Until that tag is published",
              "trusted-publisher workflow completes",
          ):
              assert phrase not in metadata, f"the long description still says {phrase!r}"
          relative = [t for t in re.findall(r"\]\(([^)]+)\)", metadata) if not re.match(r"^(https?:|mailto:|#)", t)]
          assert not relative, f"relative links 404 on pypi.org: {sorted(set(relative))}"
          PY

      # Against the built wheel in a clean venv, with `pythonpath` emptied: pytest's
      # own config puts `src` first, which would test the source tree and let a
      # packaging mistake — a module left out, package data not shipped — pass here and
      # fail for the first person who installs it.
      - name: The suite, against the wheel
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install --upgrade pip
          # `build` too: the packaging tests build an sdist of their own, and a test
          # that skips itself on a release run is a test that is not there.
          /tmp/release-check/bin/pip install "$(ls dist/*.whl)[yaml]" pytest build
          installed="$(/tmp/release-check/bin/python -c 'import histos; print(histos.__file__)')"
          case "$installed" in
            *site-packages*) ;;
            *) echo "the suite would have run against $installed, not the wheel" >&2; exit 1 ;;
          esac
          /tmp/release-check/bin/python -m pytest -q -o pythonpath=

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: [release-please, build, gates]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.gates.result == 'success' &&
        ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/histos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
